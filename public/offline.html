<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14295a" />
    <title>Offline · OASYS</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(80% 70% at 50% 45%, #13265a 0%, #050a1a 100%);
        color: #eef2fb; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { margin: 20px 0 6px; font-size: 22px; font-weight: 600; }
      p { margin: 0 auto; max-width: 300px; color: #97a3bd; }
      button {
        margin-top: 24px; height: 44px; padding: 0 22px; border: 0; border-radius: 12px;
        background: #fff; color: #13265a; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>OASYS needs a connection to load your reports and grade photos. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
